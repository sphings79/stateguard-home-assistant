snooze:
  fields:
    watch_id:
      required: false
      example: 4f2c1a9b7e30
      selector:
        text:
    entity_id:
      required: false
      example: sensor.living_room_temperature
      selector:
        entity:
    duration:
      required: true
      default: 8h
      selector:
        select:
          options:
            - "1h"
            - "8h"
            - "24h"
            - "until_morning"

