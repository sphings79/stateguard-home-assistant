<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Automation flow: StateGuard fires a stateguard_alert event carrying watch, entity, severity and reason, which an automation can act on, for example by flashing a light for security severity">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .box { fill: #16202b; stroke: #28394a; }
      .h { font-size: 16px; font-weight: 600; fill: #e6edf3; }
      .s { font-size: 13px; fill: #9fb0c0; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#41BDF5"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#0f1720"/>
  <text class="t" x="48" y="50" font-size="22" font-weight="700" fill="#e6edf3">Events for your own automations</text>

  <rect class="box" x="48" y="88" width="300" height="132" rx="12"/>
  <text class="t h" x="72" y="120">A problem is announced</text>
  <text class="t s" x="72" y="150">The grace period passed and</text>
  <text class="t s" x="72" y="172">nothing suppressed it.</text>
  <text class="t s" x="72" y="196">The severity decides the channels.</text>

  <rect class="box" x="392" y="88" width="360" height="132" rx="12"/>
  <text class="t h" x="416" y="120">Event on the bus</text>
  <text class="m" x="416" y="150" fill="#41BDF5">stateguard_alert</text>
  <text class="m" x="416" y="174" fill="#9fb0c0">watch_name · entity_id · severity</text>
  <text class="m" x="416" y="196" fill="#9fb0c0">condition · reason · repeat</text>

  <rect class="box" x="796" y="88" width="356" height="132" rx="12"/>
  <text class="t h" x="820" y="120">Your automation</text>
  <text class="t s" x="820" y="150">Flash a light, announce it on a</text>
  <text class="t s" x="820" y="172">speaker, write it to a log —</text>
  <text class="t s" x="820" y="196">anything Home Assistant can do.</text>

  <path d="M348 154 H386" stroke="#41BDF5" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M752 154 H790" stroke="#41BDF5" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <rect class="box" x="48" y="252" width="1104" height="116" rx="12"/>
  <text class="m" x="72" y="284" fill="#9fb0c0">trigger:</text>
  <text class="m" x="72" y="306" fill="#9fb0c0">  - trigger: event</text>
  <text class="m" x="72" y="328" fill="#9fb0c0">    event_type: stateguard_alert</text>
  <text class="m" x="72" y="350" fill="#9fb0c0">    event_data: { severity: Security }</text>
  <text class="t s" x="640" y="306">Also available: stateguard_escalated</text>
  <text class="t s" x="640" y="330">and stateguard_cleared.</text>
</svg>
