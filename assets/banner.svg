<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="StateGuard banner: entity and device monitoring for Home Assistant, showing a shield logo and three example alerts for an unavailable sensor, a low battery and a lock left open">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41BDF5"/>
      <stop offset="1" stop-color="#7C7CF5"/>
    </linearGradient>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="400" fill="#0f1720"/>
  <g transform="translate(64 96) scale(0.36)">
    <path d="M256 40 L440 104 v152 c0 108-78 178-184 216-106-38-184-108-184-216V104z" fill="url(#brand)"/>
    <path d="M120 268 h58 l30-62 44 130 32-74 24 34 h84" fill="none" stroke="#ffffff"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="t" x="270" y="150" font-size="64" font-weight="700" fill="#e6edf3">StateGuard</text>
  <text class="t" x="272" y="196" font-size="25" fill="#9fb0c0">Entity &amp; device monitoring for Home Assistant</text>
  <text class="t" x="272" y="236" font-size="19" fill="#41BDF5">Label what matters. Get told when it stops answering.</text>

  <g transform="translate(660 92)">
    <rect x="0" y="0" width="480" height="66" rx="12" fill="#16202b" stroke="#28394a"/>
    <circle cx="34" cy="33" r="11" fill="#ff6b6b"/>
    <text class="t" x="60" y="29" font-size="18" font-weight="600" fill="#e6edf3">Front door lock</text>
    <text class="m" x="60" y="50" font-size="13" fill="#9fb0c0">unavailable for 12m</text>

    <rect x="0" y="82" width="480" height="66" rx="12" fill="#16202b" stroke="#28394a"/>
    <circle cx="34" cy="115" r="11" fill="#FFC107"/>
    <text class="t" x="60" y="111" font-size="18" font-weight="600" fill="#e6edf3">Bedroom window sensor</text>
    <text class="m" x="60" y="132" font-size="13" fill="#9fb0c0">battery 10 % (below 25 %)</text>

    <rect x="0" y="164" width="480" height="66" rx="12" fill="#16202b" stroke="#28394a"/>
    <circle cx="34" cy="197" r="11" fill="#7C7CF5"/>
    <text class="t" x="60" y="193" font-size="18" font-weight="600" fill="#e6edf3">Weather station</text>
    <text class="m" x="60" y="214" font-size="13" fill="#9fb0c0">no report for 2d 4h</text>
  </g>

  <text class="t" x="64" y="352" font-size="16" fill="#9fb0c0">Labels · thresholds · quiet hours · SMTP, Telegram, Pushover, ntfy · own panel and card</text>
</svg>
