    <path d="M120 268 h58 l30-62 44 130 32-74 24 34 h84" fill="none" stroke="#ffffff"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="t" x="400" y="250" font-size="82" font-weight="700" fill="#e6edf3">StateGuard</text>
  <text class="t" x="404" y="308" font-size="30" fill="#9fb0c0">Entity &amp; device monitoring for Home Assistant</text>
  <text class="t" x="404" y="376" font-size="23" fill="#41BDF5">Label it · watch it · get told when it stops answering</text>
  <text class="t" x="404" y="432" font-size="20" fill="#9fb0c0">Unavailable · no data · thresholds · quiet hours · escalation</text>
  <text class="t" x="404" y="468" font-size="20" fill="#9fb0c0">SMTP · Telegram · Pushover · ntfy · own panel and card</text>
