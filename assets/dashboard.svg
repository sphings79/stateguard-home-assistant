<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Dashboard mockup: the StateGuard Lovelace card listing three current problems with severity colour, entity id, reason and age, next to the sidebar panel overview showing two active problems">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .card { fill: #16202b; stroke: #28394a; }
      .n { font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .id { font-size: 11px; fill: #6f8296; }
      .why { font-size: 12.5px; fill: #9fb0c0; }
      .age { font-size: 12.5px; fill: #6f8296; }
    </style>
  </defs>
  <rect width="1200" height="540" fill="#0f1720"/>
  <text class="t" x="48" y="48" font-size="22" font-weight="700" fill="#e6edf3">Lovelace card and panel</text>

  <rect class="card" x="48" y="80" width="530" height="330" rx="12"/>
  <circle cx="82" cy="118" r="12" fill="#ff6b6b"/>
  <text class="t" x="106" y="124" font-size="19" font-weight="600" fill="#e6edf3">StateGuard</text>
  <rect x="512" y="106" width="44" height="24" rx="12" fill="#24313f"/>
  <text class="t" x="527" y="123" font-size="13" font-weight="600" fill="#9fb0c0">3</text>

  <line x1="48" y1="148" x2="578" y2="148" stroke="#28394a"/>
  <circle cx="82" cy="180" r="9" fill="#ff6b6b"/>
  <text class="t n" x="106" y="176">Front door lock</text>
  <text class="m id" x="248" y="176">lock.front_door</text>
  <text class="t why" x="106" y="196">Security devices · state is “unavailable”</text>
  <text class="t age" x="536" y="182">12m</text>

  <line x1="48" y1="216" x2="578" y2="216" stroke="#28394a"/>
  <circle cx="82" cy="248" r="9" fill="#FFC107"/>
  <text class="t n" x="106" y="244">Bedroom window</text>
  <text class="m id" x="258" y="244">sensor.bedroom_battery</text>
  <text class="t why" x="106" y="264">Battery low · 10 % (below 25 %)</text>
  <text class="t age" x="530" y="250">3h</text>

  <line x1="48" y1="284" x2="578" y2="284" stroke="#28394a"/>
  <circle cx="82" cy="316" r="9" fill="#41BDF5"/>
  <text class="t n" x="106" y="312">Weather station</text>
  <text class="m id" x="250" y="312">sensor.weather_temp</text>
  <text class="t why" x="106" y="332">No data · no report for 2d 4h</text>
  <text class="t age" x="536" y="318">2d</text>

  <line x1="48" y1="352" x2="578" y2="352" stroke="#28394a"/>
  <text class="t why" x="106" y="382">Filterable by severity and watch, hides itself when all is well.</text>

  <rect class="card" x="622" y="80" width="530" height="330" rx="12"/>
  <circle cx="676" cy="140" r="26" fill="none" stroke="#ff6b6b" stroke-width="4"/>
  <path d="M676 126 v18 M676 152 v3" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
  <text class="t" x="722" y="136" font-size="27" font-weight="600" fill="#e6edf3">2 active problems</text>
  <text class="t why" x="724" y="162">47 entities in 5 watches</text>
  <rect x="722" y="180" width="118" height="30" rx="15" fill="none" stroke="#28394a"/>
  <text class="t why" x="740" y="200">1 Security</text>
  <rect x="852" y="180" width="102" height="30" rx="15" fill="none" stroke="#28394a"/>
  <text class="t why" x="870" y="200">1 Warning</text>

  <rect x="676" y="236" width="130" height="38" rx="9" fill="none" stroke="#28394a"/>
  <text class="t why" x="700" y="260">Check now</text>
  <rect x="820" y="236" width="180" height="38" rx="9" fill="none" stroke="#28394a"/>
  <text class="t why" x="844" y="260">Pause monitoring</text>

  <line x1="622" y1="300" x2="1152" y2="300" stroke="#28394a"/>
  <text class="t" x="676" y="332" font-size="15" font-weight="600" fill="#e6edf3">Grace period after restart</text>
  <text class="t why" x="676" y="354">Nothing is reported yet. Remaining:</text>
  <text class="m" x="924" y="354" font-size="13" font-weight="700" fill="#FFC107">4:12</text>
  <text class="t why" x="676" y="384">So it is obvious why the house is quiet.</text>
</svg>
